version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (and their "# vX" comments).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Monthly runs on the 1st of each month.
      interval: monthly
    # Wait a week before proposing a new release, so a hijacked action version has time to be caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
