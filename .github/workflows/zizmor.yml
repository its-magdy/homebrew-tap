name: zizmor

# Static security analysis of the workflows themselves (https://docs.zizmor.sh): unpinned actions, broad token
# permissions, persisted credentials, template injection, dangerous triggers.
on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  pull_request:
    paths: [".github/workflows/**", ".github/dependabot.yml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
