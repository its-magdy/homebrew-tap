name: Update dtwin formula

# Dispatched by its-magdy/design-twin's release workflow (event_type dtwin-release, client_payload.version) once
# @design-twin/dtwin is on npm; or run by hand with the version.
on:
  repository_dispatch:
    types: [dtwin-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. 0.1.1)"
        required: true

permissions: {}

concurrency:
  group: update-dtwin
  cancel-in-progress: false

jobs:
  # Check the tarball, and install it the way the formula does, in a job that holds no secret: the install runs the
  # package's code, and the deploy key that can push to main lives only in the update job below.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      url: ${{ steps.check.outputs.url }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      # The formula's bun is Homebrew's, which follows Bun's releases.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - name: Check the dtwin tarball
        id: check
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          # Read-only use: gh attestation verify fetches Sigstore's public trust roots.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A plain release version only: it is spliced into the formula and a URL.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release version: '$VERSION'"
            exit 1
          fi

          # The one artifact: the npm tarball. npm "processes" a new version for a few minutes after the publish
          # (the tarball 404s meanwhile; v0.1.1 took about 5), and this runs right after it — so wait up to ~15 min.
          URL="https://registry.npmjs.org/@design-twin/dtwin/-/dtwin-${VERSION}.tgz"
          WORK="$(mktemp -d)"
          for i in $(seq 1 30); do
            if curl -fsSL -o "$WORK/dtwin.tgz" "$URL"; then break; fi
            [ "$i" = 30 ] && { echo "::error::$URL still not downloadable after ~15 min — check the version is on npm, then re-run this workflow"; exit 1; }
            sleep 30
          done

          # Check the tarball was built by design-twin's release workflow from this version's tag (the SLSA
          # provenance npm published with it), and only then take its SHA256. A swapped tarball fails here instead
          # of being written into the formula. npm signs the tarball's sha512, hence --digest-alg.
          curl -fsSL --retry 3 "https://registry.npmjs.org/-/npm/v1/attestations/@design-twin%2fdtwin@${VERSION}" \
            | jq -ce '.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle' \
            > "$WORK/provenance.jsonl"
          gh attestation verify "$WORK/dtwin.tgz" --digest-alg sha512 \
            --bundle "$WORK/provenance.jsonl" \
            --repo its-magdy/design-twin \
            --signer-workflow its-magdy/design-twin/.github/workflows/release.yml \
            --source-ref "refs/tags/v${VERSION}" >&2

          # The formula installs the package's dependencies from the bun.lock it carries (--frozen-lockfile), so the
          # tarball's SHA256 pins them too. A tarball without one is refused: bun would resolve every range fresh,
          # with exit 0. Then the install itself, into an empty cache (each dependency checked against the lock's
          # sha512), and the code loaded against it — `dtwin --version` alone prints with no dependency installed.
          # A release that fails any of this never reaches the formula, which stays on the last good version.
          tar -xzf "$WORK/dtwin.tgz" -C "$WORK"
          PKG="$WORK/package"
          [ -f "$PKG/bun.lock" ] || { echo "::error::dtwin ${VERSION}'s tarball has no bun.lock; the formula installs only from one"; exit 1; }
          BUN_INSTALL_CACHE_DIR="$WORK/bun-cache" bun install --cwd "$PKG" --production --frozen-lockfile --ignore-scripts --no-progress
          bun --cwd "$PKG" --no-install --no-env-file -e 'await import("./src/figma-mcp.ts"); await import("./src/figma-pull.ts")'
          GOT=$(bun --cwd "$PKG" --no-install --no-env-file src/figma-pull.ts --version)
          [ "$GOT" = "$VERSION" ] || { echo "::error::dtwin --version printed '$GOT', expected $VERSION"; exit 1; }

          SHA256=$(sha256sum "$WORK/dtwin.tgz" | awk '{print $1}')
          rm -rf "$WORK"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256: '$SHA256'"; exit 1; }
          echo "dtwin ${VERSION}: ${SHA256}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

  update:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The formula commit is pushed with the TAP_DEPLOY_KEY deploy key, not GITHUB_TOKEN: the main-branch
          # ruleset lets only deploy keys (and the repo admin) push directly, which keeps out every other token
          # with write access (e.g. the upstream release workflows' GitHub App token, which only needs to dispatch).
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          persist-credentials: true
          # main as it is now. A repository_dispatch run's own commit is main as it was when the release sent the
          # event, so a merge landing in between would get the formula commit's push rejected (v0.1.2, v0.1.3).
          ref: main

      - name: Update dtwin formula
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          URL: ${{ needs.verify.outputs.url }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail

          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::verify gave no sha256: '$SHA256'"; exit 1; }
          [ "$URL" = "https://registry.npmjs.org/@design-twin/dtwin/-/dtwin-${VERSION}.tgz" ] || { echo "::error::unexpected url: '$URL'"; exit 1; }

          # The bytes the verify job checked, or nothing: npm serves a published version's tarball unchanged.
          WORK="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$WORK/dtwin.tgz" "$URL"
          GOT=$(sha256sum "$WORK/dtwin.tgz" | awk '{print $1}')
          rm -rf "$WORK"
          [ "$GOT" = "$SHA256" ] || { echo "::error::$URL is now $GOT, the verify job checked $SHA256"; exit 1; }

          FORMULA="Formula/dtwin.rb"
          sed -i -E \
            -e "s|^  url \".*\"|  url \"${URL}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            "$FORMULA"

          # The url and the hash must both have landed.
          grep -qxF "  url \"${URL}\"" "$FORMULA" || { echo "::error::url not written"; exit 1; }
          grep -qxF "  sha256 \"${SHA256}\"" "$FORMULA" || { echo "::error::sha256 not written"; exit 1; }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: update dtwin to v${VERSION}"
          git push
